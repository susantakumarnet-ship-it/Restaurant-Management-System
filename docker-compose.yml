services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    # server/.env must contain MONGODB_URI (your MongoDB Atlas connection string) and JWT_SECRET.
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      EXPOSE_OTP: "false"
    volumes:
      - uploads:/app/server/uploads

volumes:
  uploads:
